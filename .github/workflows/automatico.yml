name: Formatar Codigo Streamlit
on: [push]
permissions:
  contents: write

jobs:
  formatar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install black
      - run: black app.py || true
      - run: |
          git config user.name "Robô"
          git config user.email "robo@github.com"
          git add app.py
          git commit -m "Formata app.py" || exit 0
          git push
